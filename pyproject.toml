[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypervigilant"
version = "25.0.0"
description = "A collection of code for hypervigilant - wrapper for instrumentation."
authors = [{name="GAO Hongnan", email="hongnangao@gmail.com"}]
maintainers = [{name="GAO Hongnan", email="hongnangao@gmail.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "structlog>=26.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
    "cachetools>=7.1.7",
]

[project.optional-dependencies]
playground = [
    "pydanticonf>=2.0.0",
    "rich>=15.0.0",
]
redis = [
    "redis>=8.1.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
]

[dependency-groups]
lint = [
    "bandit>=1.9.4",
    "commitizen>=4.17.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]

type = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "typeguard>=4.6.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
]

test = [
    "coverage>=7.15.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "redis>=8.1.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
]

docs = [
    "jupyter-book>=2.1.6",
]

dev = [
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "test" },
    { include-group = "docs" },
]

[project.urls]
Homepage = "https://github.com/gao-hongnan/hypervigilant"
Documentation = "https://github.com/gao-hongnan/hypervigilant/tree/main/playbook"
Repository = "https://github.com/gao-hongnan/hypervigilant"
Issues = "https://github.com/gao-hongnan/hypervigilant/issues"
Changelog = "https://github.com/gao-hongnan/hypervigilant/releases"

[tool.hatch.build.targets.wheel]
packages = ["hypervigilant"]
exclude = [
    "tests/",
    "docs/",
    "playbook/",
    "playground/",
    "examples/",
    "scripts/",
    "*.pyc",
    "__pycache__/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".coverage",
    "htmlcov/",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs/",
    "playbook/",
    "playground/",
    "examples/",
    "scripts/",
    "*.pyc",
    "__pycache__/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".git/",
    ".github/",
    ".venv/",
    "dist/",
    "build/",
    ".coverage",
    "htmlcov/",
    ".DS_Store",
]

[tool.uv]
managed = true

[tool.bandit]
exclude_dirs = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    "venv_*",
    "venv",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]
