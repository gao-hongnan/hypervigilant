# Reference:
# https://github.com/tiangolo/fastapi/blob/master/pyproject.toml
# https://github.com/pydantic/pydantic/blob/main/pyproject.toml
[pytest]
minversion=9.0
pythonpath=.
addopts=
    --strict-config
    --strict-markers
    --import-mode=importlib
    --doctest-modules
    --doctest-glob=
testpaths=
    hypervigilant
    tests
asyncio_mode=auto
xfail_strict=true
filterwarnings=
    error
    # SQLModel marks AsyncSession.execute() @deprecated in favour of exec(), but exec()
    # has no overload accepting a TextClause -- raw SQL in the integration suite has no
    # other session-level API. Remove when sqlmodel accepts Executable in exec().
    ignore:(?s).*session\.exec\(\).*instead of.*:DeprecationWarning
    # Every ResourceWarning this suite raises comes out of a third-party finaliser, none
    # of which owns a transport this repo opened: redis-py's AbstractConnection.__del__
    # and asyncio's StreamWriter/_SelectorTransport.__del__ during the Redis integration
    # tier, and docker-py's version-probe socket when no daemon answers. Left as errors
    # they surface as PytestUnraisableExceptionWarning attached to whichever unrelated
    # test happened to trigger the GC, so a red run points at the wrong code. Note this
    # keeps genuine unraisable exceptions failing -- only the ResourceWarning that
    # promotes them is silenced. Revisit if this package ever owns an async transport.
    ignore::ResourceWarning
markers =
    asyncio: mark test as an async test
    unit: pure-logic test with no I/O or external services
    integration: integration test that may use real services (Postgres/Redis via Docker)
